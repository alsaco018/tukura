server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Gift-card page: HTTP Basic Auth (credentials from container env)
    location ^~ /tarjeta-regalo {
        auth_basic "Tarjeta regalo TUKURA";
        auth_basic_user_file /etc/nginx/gift-card.htpasswd;

        try_files $uri $uri/ $uri.html /tarjeta-regalo/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
