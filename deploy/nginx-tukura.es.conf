# Copy to the VPS, e.g.:
#   /etc/nginx/sites-available/tukura.es
#   ln -s /etc/nginx/sites-available/tukura.es /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx
# Then: certbot --nginx -d tukura.es -d www.tukura.es

server {
    listen 80;
    listen [::]:80;
    server_name tukura.es www.tukura.es;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: redirect tu-kura.com → tukura.es (HTTP; Certbot can add HTTPS later)
server {
    listen 80;
    listen [::]:80;
    server_name tu-kura.com www.tu-kura.com;

    return 301 https://tukura.es$request_uri;
}
