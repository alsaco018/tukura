    <text class="st3" text-anchor="middle" transform="translate(637.795 139.01)"><tspan x="0" y="0">A veces, entre el ritmo del día a día, las responsabilidades</tspan><tspan x="0" y="19">y todo aquello que vamos sosteniendo, necesitamos hacer</tspan><tspan x="0" y="38">una pausa.</tspan><tspan x="0" y="76">Esta tarjeta es una invitación a relagalarte ese momento</tspan><tspan x="0" y="95">para ti, con una sesión de masaje en TUKURA.</tspan><tspan x="0" y="114">Un espacio para dejar a un lado las prisas, escuchar</tspan><tspan x="0" y="133">lo que necesitas y cuidar tu cuerpo. Para soltar tensiones,</tspan><tspan x="0" y="152">respirar y liberarte.</tspan><tspan x="0" y="190">Disfruta de este momento para ti.</tspan><tspan x="0" y="209">Tu cuerpo también merece un poco de calma.</tspan></text>
    <text class="st7" text-anchor="middle" transform="translate(637.795 79.57)"><tspan x="0" y="0">UN REGALO PARA PARAR,</tspan><tspan x="0" y="19">SENTIR Y VOLVER A TI.</tspan></text>
